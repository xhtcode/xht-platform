server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: xht-auth
              uri: lb://xht-auth #此处需要使用lb协议
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: xht--admin
              uri: lb://xht-admin #此处需要使用lb协议
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: xht-generate
              uri: lb://xht-generate # 服务注册名为 xht-generate（见 xht-generate-start/application.yml）
              predicates:
                - Path=/generate/**
              filters:
                - StripPrefix=1
          default-filters:

xht:
  global:
    banner:
      enable: true
    app-name: 网关服务
    host-name: www.xht.com
knife4j:
  gateway:
    enabled: true     # ① 第一个配置，开启gateway聚合组件
    strategy: discover # ② 第二行配置，设置聚合模式采用discover服务发现的模式
    discover:
      enabled: true   # ③ 第三行配置，开启discover模式
      version: openapi3 # ④ 第四行配置，聚合子服务全部为Swagger2规范的文档
