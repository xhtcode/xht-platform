server:
  port: 9700

spring:
  application:
    name: xht-module-generate
  profiles:
    active: @profiles.active@
  # 数据源配置
  datasource:
    password: 123456
    url: jdbc:mysql://localhost:3306/xht_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      resource server:
        opaque token:
          introspection-uri: http://www.xht.sso.com:9000/oauth2/introspect
          client-id: oidc-client
          client-secret: secret
        jwt:
          issuer-uri: ${xht.security.oauth2.issuer}
  cloud:
    nacos:
      discovery:
        server-addr: @nacos.discovery.address@
        username: @nacos.username@
        password: @nacos.password@
        namespace: @nacos.namespace@
        group: @nacos.group@
      config:
        server-addr: @nacos.config.address@
        username: @nacos.username@
        password: @nacos.password@
        namespace: @nacos.namespace@
        group: @nacos.group@
        file-extension: yml
        prefix: ${spring.application.name} # 默认配置
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/moa
xht:
  global:
    banner:
      enable: true
    app-name: 代码生成器
    host-name: www.xht.com
    dict:
      key-prefix: 'xht:'
      time-out: 3600
      unit: seconds
  security:
    whitelist:
      add-default-ignore-urls: true
      add-swagger-ignore-urls: true
      endpoints:
    xss:
      enable: true
    header:
      auth-key: X-Auth-Token
      auth-value: 123456
    token:
      lightning-cache:
        expired: 300
  oauth2:
    grant-type:
      value: 123456
  blog:
    repository-type: feign
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  override-with-generic-response: false # 解决springdoc和knife4版本冲突问题
  default-flat-param-object: true # 解决参数列表显示问题
  paths-to-exclude:
    - /api/**
    - /error
    - /actuator/**
    - /favicon.ico
mybatis-plus:
  configuration:
    default-executor-type: batch
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration-properties:
    delFlag: ${mybatis-plus.global-config.db-config.logic-not-delete-value}