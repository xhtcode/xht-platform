server:
  port: 8090

spring:
  application:
    name: xht-workflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xht_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  profiles:
    active: dev
  data:
    redis:
      password:
      host: 127.0.0.1
      port: 6379
      database: 1
springdoc:
  api-docs:
    enabled: true
  override-with-generic-response: false # 解决springdoc和knife4版本冲突问题
xht:
  safety:
    xss:
      enable: true
  global:
    banner:
      enable: true
    app-name: 工作流
mybatis-plus:
  configuration:
    default-executor-type: batch
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration-properties:
    delFlag: ${mybatis-plus.global-config.db-config.logic-not-delete-value}
